<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a14"><title>notoow · Neon ZigZag</title><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=2"></head>
<body><main id="game-container"><canvas tabindex="0" id="gameCanvas" aria-label="네온 지그재그 게임. 코너에서 클릭하거나 Space를 누르세요."></canvas>
<a class="brand home-brand" href="https://notoow.com/" aria-label="notoow 홈으로"><img src="notoow-2d.png" alt="">notoow <span aria-hidden="true">↗</span></a><header class="hud"><div><small id="play-mode">NEON ZIGZAG</small><b id="score-board">0</b></div><button id="pause-btn" hidden aria-label="일시정지">Ⅱ</button></header><div id="beat-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p id="input-status">코너에서 탭 · Space</p>
<section id="start-screen" class="screen"><h1 class="wordmark">notoow</h1><p class="game-title">NEON ZIGZAG</p><p>박자를 타고, 코너에서 탭.</p><p class="hint">클릭 · 터치 · Space / Z / X<br>빠른 구간은 양손으로 번갈아 누르세요.</p><div class="best">내 최고 기록 <b id="best">0</b></div><button id="start-btn" class="primary">바로 플레이</button><button id="ranked-btn">Google 로그인 · 랭킹 도전</button><button data-ranks class="quiet">랭킹 보기 ↗</button><button id="sound-btn" class="quiet" aria-pressed="true">사운드 켜짐</button><p id="start-status" role="status"></p></section>
<section id="pause-screen" class="screen" hidden><h2>잠깐 쉬어가기</h2><p>돌아오면 이어서 플레이할 수 있어요.</p><button id="resume-btn" class="primary">계속하기</button></section>
<section id="game-over-screen" class="screen" hidden><span class="eyebrow">NICE RUN</span><h2>GAME OVER</h2><strong id="final-score">0</strong><p id="accuracy" class="hint"></p><form id="submit-score" hidden><label for="nickname">닉네임</label><input id="nickname" maxlength="16" minlength="1" required autocomplete="off" placeholder="1~16자"><button id="submit-btn" class="primary">랭킹에 올리기</button></form><p id="rank-message" role="status" class="hint"></p><button id="quick-retry" class="primary">바로 다시 하기</button><button id="restart-btn">메뉴</button><button data-ranks class="quiet">랭킹 보기 ↗</button></section>
</main><dialog id="rank-dialog"><div class="dialog-top"><h2>TOP 20</h2><button id="close-ranks" aria-label="닫기">×</button></div><p id="rank-status" role="status"></p><ol id="rank-list"></ol><p class="hint">notoow 계정별 최고 점수 · 가벼운 경쟁용 랭킹<br>닉네임과 점수만 공개됩니다.</p><button id="refresh-ranks">새로고침</button></dialog><script type="module" src="script.js?v=2"></script></body></html>
